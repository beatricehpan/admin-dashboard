<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">Dashboard</div>
        <ul class="nav">
            <li>Home</li>
            <li>Profile</li>
            <li>Messages</li>
            <li>History</li>
            <li>Tasks</li>
            <li>Communities</li>
        </ul>
        <ul class="nav">
            <li>Settings</li>
            <li>Support</li>
            <li>Privacy</li>
        </ul>
    </div>
    <div class="header">
        <div class="search">
            <input type="search" placeholder="Search">
        </div>
        <div class="user">
            <span>🔔</span>
            <span>Beatrice</span>
        </div>
        <div class="greeting">
            <p>Hi there,</p>
            <h2>Beatrice Pan (@beatricehpan)</h2>
        </div>
        <div class="buttons">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
        </div>
    </div>
    <div class="main">Main content</div>
</body>

</html>
